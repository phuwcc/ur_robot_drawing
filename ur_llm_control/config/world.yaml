frame_id: base_link
ee_link: tool0
group_name: ur_manipulator

gripper:
  model: robotiq_2f85
  action_name: /robotiq_gripper_controller/follow_joint_trajectory
  open_position: 0.0
  closed_position: 0.65
  motion_duration: 2.0
  command_timeout: 8.0
  bridge_timeout: 15.0
  joint_timeout: 5.0
  touch_links:
    - ur_to_robotiq_link
    - gripper_mount_link
    - robotiq_85_base_link
    - robotiq_85_left_knuckle_link
    - robotiq_85_right_knuckle_link
    - robotiq_85_left_finger_link
    - robotiq_85_right_finger_link
    - robotiq_85_left_inner_knuckle_link
    - robotiq_85_right_inner_knuckle_link
    - robotiq_85_left_finger_tip_link
    - robotiq_85_right_finger_tip_link
world_name: pick_place

table:
  id: work_table
  position: [0.43, 0.0, 0.075]
  size: [0.46, 0.65, 0.15]

objects:
  red_cube:
    position: [0.28, -0.18, 0.18]
    size: 0.05
  yellow_cube:
    position: [0.35, -0.18, 0.18]
    size: 0.05
  blue_cube:
    position: [0.42, -0.18, 0.18]
    size: 0.05

zones:
  zone_a:
    position: [0.28, 0.10, 0.18]
  zone_b:
    position: [0.28, 0.18, 0.18]
  zone_c:
    position: [0.28, 0.26, 0.18]

motion:
  approach_height: 0.06
  # tool0-to-gripper_tcp distance from the fixed joint in the robot URDF.
  tool_length: 0.176
  # Keep the finger tips clear of the tabletop while gripping the cube sides.
  grasp_height_offset: 0.016
  velocity_scale: 0.08
  acceleration_scale: 0.08
  orientation_tolerance: 0.02
  # Avoid equivalent IK solutions near +/-2*pi; they leave no joint travel for
  # the short vertical Cartesian segments used by pick and place.
  pose_joint_limits:
    wrist_1_joint: [-3.0, 3.0]
  continuous_joints:
    - wrist_3_joint
  planning_time: 10.0
  # Keep tool Z pointing down and rotate the jaws across the row of cubes.
  grasp_orientation: [0.70710678, 0.70710678, 0.0, 0.0]
  home_joints:
    shoulder_pan_joint: 1.5708
    shoulder_lift_joint: -1.5708
    # Fold the elbow and wrist so the long Robotiq fingers stay clear of the
    # forearm while returning home.
    elbow_joint: 1.5708
    wrist_1_joint: -1.5708
    wrist_2_joint: 0.0
    wrist_3_joint: 0.0
