frame_id: base_link
ee_link: tool0
group_name: ur_manipulator
gripper:
  model: robotiq_2f85
  action_name: /robotiq_gripper_controller/follow_joint_trajectory
  open_position: 0.0
  # The 2F-85 collision meshes have a ~50.7 mm inner aperture at 0.35 rad.
  # All objects are 50 mm cubes, so do not drive the position controller to
  # the nearly-closed 0.65 rad pose (about 17 mm), which tunnels through them.
  closed_position: 0.35
  motion_duration: 2.0
  command_timeout: 40.0
  bridge_timeout: 15.0
  joint_timeout: 5.0
  touch_links:
  - ur_to_robotiq_link
  - gripper_mount_link
  - robotiq_85_base_link
  - robotiq_85_left_knuckle_link
  - robotiq_85_right_knuckle_link
  - robotiq_85_left_finger_link
  - robotiq_85_right_finger_link
  - robotiq_85_left_inner_knuckle_link
  - robotiq_85_right_inner_knuckle_link
  - robotiq_85_left_finger_tip_link
  - robotiq_85_right_finger_tip_link
world_name: pick_place
table:
  id: work_table
  position:
  - 0.43
  - 0.0
  - 0.075
  size:
  - 0.46
  - 0.65
  - 0.15
objects:
  red_cube:
    size: 0.05
  yellow_cube:
    size: 0.05
  blue_cube:
    size: 0.05
  green_cube:
    size: 0.05
  purple_cube:
    size: 0.05
zones:
  zone_a:
    position:
    - 0.28
    - 0.1
    - 0.175
    radius: 0.035
  zone_b:
    position:
    - 0.28
    - 0.18
    - 0.175
    radius: 0.035
  zone_c:
    position:
    - 0.28
    - 0.26
    - 0.175
    radius: 0.035
motion:
  approach_height: 0.06
  release_clearance: 0.01
  tool_length: 0.176
  # tool_length already ends at the gripper TCP.  An extra positive offset put
  # the cube almost beyond the fingertip collision meshes.
  grasp_height_offset: 0.0
  velocity_scale: 0.08
  acceleration_scale: 0.08
  orientation_tolerance: 0.02
  pose_joint_limits:
    wrist_1_joint:
    - -3.0
    - 3.0
  continuous_joints:
  - wrist_3_joint
  # These UR joints admit a kinematically identical angle shifted by 2*pi.
  # Select the representation nearest the live state for pose-goal IK. The
  # elbow is omitted because its configured range is only [-pi, pi].
  equivalent_angle_joints:
  - shoulder_pan_joint
  - shoulder_lift_joint
  - wrist_1_joint
  - wrist_2_joint
  - wrist_3_joint
  equivalent_angle_joint_limits:
    # Leave a small numerical margin around +/-2*pi. Using 6.283185 exactly
    # rejected the mathematically equivalent -2*pi candidate by 3e-7 rad.
    shoulder_pan_joint: [-6.284, 6.284]
    shoulder_lift_joint: [-6.284, 6.284]
    wrist_1_joint: [-6.284, 6.284]
    wrist_2_joint: [-6.284, 6.284]
  # Reject a distant IK branch even if it reaches the same tool pose. The
  # normalized shortest angular displacement cannot exceed pi.
  max_pose_joint_delta: 3.2
  ik_joint_tolerance: 0.01
  planning_time: 10.0
  grasp_orientation:
  - 0.70710678
  - 0.70710678
  - 0.0
  - 0.0
  # Move the open gripper above the middle of the table before folding the
  # arm into its joint-space home posture. This keeps the fingers clear of the
  # forearm instead of relying on a single long joint-space interpolation.
  home_transit_position:
  - 0.32
  - 0.05
  - 0.46
  home_joints:
    shoulder_pan_joint: 1.5708
    shoulder_lift_joint: -1.5708
    elbow_joint: 1.5708
    wrist_1_joint: -1.5708
    wrist_2_joint: 0.0
    wrist_3_joint: 0.0
camera:
  position:
  - 0.43
  - 0.0
  - 1.3
  horizontal_fov: 1.0
  width: 800
  height: 800
  image_topic: /camera/image
  max_age: 2.0
  timeout: 12.0
  min_area: 200
  stable_frames: 3
  position_tolerance: 0.008
  # The gripper can hide one neighboring cube. Its last complete pre-pick
  # camera position remains a conservative collision obstacle during place.
  max_occluded_while_holding: 1
  # Between consecutive transfers, the arm may simultaneously hide the cube
  # just released and the next cube. Only those two named, cached objects are
  # accepted; disappearance of any unrelated object still stops execution.
  max_occluded_during_transition: 2
workspace:
  bounds:
  - 0.235
  - 0.48
  - -0.27
  - 0.285
  # Cube centers in neighboring zones are 80 mm apart. With 50 mm cubes, a
  # 15 mm occupancy margin preserves separation without camera noise making a
  # correctly placed cube in Zone C appear to occupy Zone B as well.
  clearance: 0.015
  grid_step: 0.025
  zone_clearance: 0.07
  placement_tolerance: 0.018
