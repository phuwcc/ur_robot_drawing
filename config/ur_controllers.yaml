controller_manager:
  ros__parameters:
    update_rate: 500
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController
    robotiq_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 5.0
      shoulder_pan_joint: {trajectory: 0.3, goal: 0.15}
      shoulder_lift_joint: {trajectory: 0.3, goal: 0.15}
      elbow_joint: {trajectory: 0.3, goal: 0.15}
      wrist_1_joint: {trajectory: 0.3, goal: 0.15}
      wrist_2_joint: {trajectory: 0.3, goal: 0.15}
      wrist_3_joint: {trajectory: 0.3, goal: 0.15}

scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    speed_scaling_interface_name: ""
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 5.0
      shoulder_pan_joint: {trajectory: 0.3, goal: 0.15}
      shoulder_lift_joint: {trajectory: 0.3, goal: 0.15}
      elbow_joint: {trajectory: 0.3, goal: 0.15}
      wrist_1_joint: {trajectory: 0.3, goal: 0.15}
      wrist_2_joint: {trajectory: 0.3, goal: 0.15}
      wrist_3_joint: {trajectory: 0.3, goal: 0.15}

robotiq_gripper_controller:
  ros__parameters:
    joints:
      - robotiq_85_left_knuckle_joint
      - robotiq_85_right_knuckle_joint
      - robotiq_85_left_inner_knuckle_joint
      - robotiq_85_right_inner_knuckle_joint
      - robotiq_85_left_finger_tip_joint
      - robotiq_85_right_finger_tip_joint
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
